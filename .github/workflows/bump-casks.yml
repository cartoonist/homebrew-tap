name: Bump casks

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        cask:
          - alacritty
          - fontforge-app
          - qbittorrent
          - rar
          - stretchly
          - tau
    steps:
      - name: Set up Homebrew (taps this repo)
        id: setup
        uses: Homebrew/actions/setup-homebrew@main

      - name: Check for a newer release
        id: livecheck
        working-directory: ${{ steps.setup.outputs.repository-path }}
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          json=$(brew livecheck --cask --json --newer-only ${{ steps.setup.outputs.tap-name }}/${{ matrix.cask }})
          echo "$json"
          new=$(echo "$json" | jq -r '.[0].version.latest // empty')
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Bump cask file
        if: steps.livecheck.outputs.new != ''
        working-directory: ${{ steps.setup.outputs.repository-path }}
        run: |
          brew bump-cask-pr --write-only --no-audit --no-style \
            --version "${{ steps.livecheck.outputs.new }}" \
            ${{ steps.setup.outputs.tap-name }}/${{ matrix.cask }}
          git diff

      - name: Open pull request
        if: steps.livecheck.outputs.new != ''
        uses: peter-evans/create-pull-request@v7
        with:
          path: ${{ steps.setup.outputs.repository-path }}
          commit-message: "${{ matrix.cask }} ${{ steps.livecheck.outputs.new }}"
          title: "${{ matrix.cask }} ${{ steps.livecheck.outputs.new }}"
          body: "Automated bump via `brew livecheck` + `brew bump-cask-pr --write-only`."
          branch: bump/${{ matrix.cask }}-${{ steps.livecheck.outputs.new }}
          delete-branch: true
